<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1026"/>
      <stop offset="50%" stop-color="#2A1B36"/>
      <stop offset="100%" stop-color="#120A1A"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0"/>
      <stop offset="45%" stop-color="#E1C38B"/>
      <stop offset="100%" stop-color="#B89657"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#iconBg)"/>

  <!-- Ornate Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#iconGold)" stroke-width="4" opacity="0.8"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#iconGold)" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Mystical Stars & Radiance -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#iconGold)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#iconGold)" stroke-width="2" stroke-dasharray="6,8" opacity="0.7"/>

  <!-- Central Tarot Arcana Heart & Star -->
  <g transform="translate(256, 256)">
    <!-- 8 pointed star rays -->
    <polygon points="0,-170 30,-30 170,0 30,30 0,170 -30,30 -170,0 -30,-30" fill="rgba(225, 195, 139, 0.08)" stroke="url(#iconGold)" stroke-width="2"/>

    <!-- Sacred Love Heart -->
    <path d="M 0 55 C -65 15 -100 -35 -55 -75 C -25 -100 0 -65 0 -65 C 0 -65 25 -100 55 -75 C 100 -35 65 15 0 55 Z" fill="url(#iconGold)"/>

    <!-- Eye of intuition in the heart -->
    <circle cx="0" cy="-25" r="18" fill="#221430" stroke="url(#iconGold)" stroke-width="3"/>
    <circle cx="0" cy="-25" r="7" fill="url(#iconGold)"/>

    <!-- Radiant sparkle -->
    <polygon points="0,-130 8,-100 0,-70 -8,-100" fill="url(#iconGold)"/>
    <polygon points="0,70 8,100 0,130 -8,100" fill="url(#iconGold)"/>
  </g>
</svg>
