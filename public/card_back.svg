<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1026" />
      <stop offset="50%" stop-color="#2A1B36" />
      <stop offset="100%" stop-color="#150C1E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1D6" />
      <stop offset="40%" stop-color="#E1C38B" />
      <stop offset="80%" stop-color="#B89657" />
      <stop offset="100%" stop-color="#E1C38B" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(225, 195, 139, 0.2)" />
      <stop offset="100%" stop-color="rgba(225, 195, 139, 0.02)" />
    </linearGradient>
    <pattern id="sacredGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="rgba(225, 195, 139, 0.08)" stroke-width="0.8"/>
      <circle cx="20" cy="20" r="4" fill="none" stroke="rgba(225, 195, 139, 0.08)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="300" height="500" rx="16" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="300" height="500" rx="16" fill="url(#sacredGrid)" />

  <!-- Outer Double Borders -->
  <rect x="10" y="10" width="280" height="480" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  <rect x="18" y="18" width="264" height="464" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.8" />
  <rect x="24" y="24" width="252" height="452" rx="6" fill="url(#innerGlow)" stroke="url(#goldGrad)" stroke-width="1.2" />

  <!-- Corner Ornaments -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.2">
    <!-- Top Left -->
    <path d="M 24 44 C 36 44 44 36 44 24" />
    <circle cx="38" cy="38" r="3" fill="url(#goldGrad)" />
    <!-- Top Right -->
    <path d="M 276 44 C 264 44 256 36 256 24" />
    <circle cx="262" cy="38" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Left -->
    <path d="M 24 456 C 36 456 44 464 44 476" />
    <circle cx="38" cy="462" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Right -->
    <path d="M 276 456 C 264 456 256 464 256 476" />
    <circle cx="262" cy="462" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Celestial Central Mandala -->
  <g transform="translate(150, 250)">
    <!-- Outer Star Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.6"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" />

    <!-- 8-Pointed Star -->
    <polygon points="0,-75 22,-22 75,0 22,22 0,75 -22,22 -75,0 -22,-22" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.9"/>
    <polygon points="0,-60 16,-16 60,0 16,16 0,60 -16,16 -60,0 -16,-16" fill="rgba(225, 195, 139, 0.06)" stroke="url(#goldGrad)" stroke-width="0.8" transform="rotate(22.5)" />

    <!-- Moon phases top and bottom -->
    <!-- Top Moon -->
    <path d="M 0 -42 A 10 10 0 0 0 0 -22 A 7 10 0 0 1 0 -42" fill="url(#goldGrad)" />
    <!-- Bottom Moon -->
    <path d="M 0 42 A 10 10 0 0 0 0 22 A 7 10 0 0 1 0 42" fill="url(#goldGrad)" />

    <!-- Center Heart & Sunburst (Love Tarot Theme) -->
    <circle cx="0" cy="0" r="30" fill="#221430" stroke="url(#goldGrad)" stroke-width="1.4" />
    
    <!-- Stylized Heart in Center -->
    <path d="M 0 10 C -12 2 -18 -8 -10 -15 C -4 -20 0 -13 0 -13 C 0 -13 4 -20 10 -15 C 18 -8 12 2 0 10 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Center Diamond Star -->
    <polygon points="0,-5 3,0 0,5 -3,0" fill="#1B1026" />

    <!-- Rays -->
    <line x1="0" y1="-85" x2="0" y2="-98" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="0" y1="85" x2="0" y2="98" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="-85" y1="0" x2="-98" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
    <line x1="85" y1="0" x2="98" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" />
  </g>

  <!-- Top & Bottom Mystical Eyes / Hearts -->
  <g transform="translate(150, 75)" stroke="url(#goldGrad)" fill="none" stroke-width="1">
    <circle cx="0" cy="0" r="14" fill="#221430"/>
    <polygon points="0,-12 4,0 0,12 -4,0" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#1B1026"/>
  </g>

  <g transform="translate(150, 425)" stroke="url(#goldGrad)" fill="none" stroke-width="1">
    <circle cx="0" cy="0" r="14" fill="#221430"/>
    <polygon points="0,-12 4,0 0,12 -4,0" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#1B1026"/>
  </g>
</svg>
